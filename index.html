<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style-dark.css" id="theme-link">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
     <main>
    <nav>
        <div class="nav-bar">
            <div class="right">
                <h2>Anss</h2>
            </div>
            <div class="left">
                <button id="toggleModal">Add New Task</button>

            <div class="theme" >
               
                <button id="theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
            </div>
        </div>
        
    </nav>
    
      
        <section>
         <div id="todo" class="column">
            <div class="heading">
                <div class="right">Todo</div>
                <div class="left">Count</div>
            </div>
            <!-- <div draggable="true" class="task">
                <h2>Task1</h2>
                <p>Description for task 1 </p>
                <button>Delete</button>
            </div> -->
        </div>
        <div id="progress" class="column">
            <div class="heading">
                <div class="right">In Progress</div>
            <div class="left">Count</div>
            </div>

        </div>
        <div id="done" class="column">
            <div class="heading">
                <div class="right">Done</div>
            <div  class="left">Count</div>
            </div>
        </div>
        
       </section>
    </main>

     <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input id="task-title" type="text" placeholder="Task Title">
        <textarea placeholder="Task Description" id="textArea"></textarea>
        <div class="btns">
            <button id="add-new-task">Add Task</button> <button id="cancel-new-task">Cancel</button>
        </div>
        </div>
       </div>





    <script src="script.js"></script>
</body>
</html>
